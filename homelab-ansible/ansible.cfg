[defaults]
# Semaphore passes its own inventory with -i; this is used when running locally.
inventory = inventory/hosts.yml
roles_path = roles
retry_files_enabled = False
interpreter_python = auto_silent
# Easier-to-read task output in the Semaphore log.
callback_result_format = yaml
forks = 10
# Homelab convenience. Set to True once all host keys are known.
host_key_checking = False

[ssh_connection]
pipelining = True
