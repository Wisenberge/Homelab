---
# Homelab inventory. Replace the IPs with your own.
# In Semaphore, create an Inventory of type "File" pointing at: inventory/hosts.yml
all:
  children:
    # Every host that should get Docker installed.
    docker_hosts:
      hosts:
        docker01:
          ansible_host: 192.168.1.20

    # Hosts that run the Caddy reverse proxy (usually just one).
    proxy_hosts:
      hosts:
        docker01:

    # Hosts that run Uptime Kuma monitoring.
    monitoring_hosts:
      hosts:
        docker01:

    # Host that runs the OpenTofu container to build Proxmox VMs.
    tofu_hosts:
      hosts:
        docker01:

    # Hosts that join Tailscale. Must include your proxy host, so Caddy can
    # reach machines on the tailnet (like your brother's Jellyfin server).
    tailscale_hosts:
      hosts:
        docker01:

    # Host that keeps your public DNS records pointed at your home IP.
    # Does nothing until you set ddns_domains (skip it with a static IP).
    ddns_hosts:
      hosts:
        docker01:
